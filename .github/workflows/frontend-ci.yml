name: FactoryFlow Frontend CI
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Pin the Playwright runner. The existing npm lock remains the app dependency source of truth.
      - name: Install browser smoke runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      # GitHub Ubuntu 24.04 image includes Chrome. Avoid multi-minute browser downloads.
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - name: Browser UI smoke with isolated API fixtures
        run: npx playwright test --config playwright.config.js
      # Production preview must use IndexedDB, not HTTP /api or server fixtures.
      - name: Browser demo smoke with real IndexedDB (production bundle)
        run: npx playwright test --config playwright.demo.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: factoryflow-ui-browser-failures
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: factoryflow-frontend-dist
          path: frontend/dist
