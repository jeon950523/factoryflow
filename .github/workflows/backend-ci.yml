name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test against Testcontainers MySQL
        working-directory: backend
        run: ./gradlew --no-daemon --stacktrace clean test
      - name: Upload test results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoryflow-backend-test-results
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7
