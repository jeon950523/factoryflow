name: FactoryFlow Fullstack Browser E2E

on:
  workflow_dispatch:
  # Fullstack browser runs are costly: test on PR and main, not every feature commit.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/fullstack-ui-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/fullstack-ui-ci.yml'

permissions:
  contents: read

concurrency:
  group: fullstack-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-browser-e2e:
    # All ports are runner-local; never publish this unauthenticated application externally.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: factoryflow
          MYSQL_USER: factoryflow_ci
          MYSQL_PASSWORD: test_password_only
          MYSQL_ROOT_PASSWORD: test_root_only
          TZ: UTC
        ports:
          - 23307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_root_only"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend application
        working-directory: backend
        run: ./gradlew --no-daemon bootJar -x test
      - name: Start real Spring Boot with CI MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:23307/factoryflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
          DB_USERNAME: factoryflow_ci
          DB_PASSWORD: test_password_only
          SPRING_PROFILES_ACTIVE: local
          FACTORYFLOW_ADMIN_USERNAME: ciadmin
          FACTORYFLOW_ADMIN_PASSWORD: ci-test-strong-password-only
        run: |
          jar_path="$(find backend/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          if [ -z "$jar_path" ]; then
            find backend/build/libs -maxdepth 1 -type f -print
            echo 'Spring Boot executable JAR missing'
            exit 1
          fi
          echo "Starting $jar_path"
          nohup java -jar "$jar_path" > /tmp/factoryflow-server.log 2>&1 &
          echo $! > /tmp/factoryflow-server.pid
          for n in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo 'Spring Boot + Flyway + MySQL started'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/factoryflow-server.pid)" 2>/dev/null; then
              tail -n 120 /tmp/factoryflow-server.log
              exit 1
            fi
            sleep 2
          done
          tail -n 150 /tmp/factoryflow-server.log
          exit 1
      - name: Install frontend and Playwright runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          google-chrome --version
      - name: Browser commands against real API + MySQL
        working-directory: frontend
        env:
          E2E_ADMIN_USERNAME: ciadmin
          E2E_ADMIN_PASSWORD: ci-test-strong-password-only
        run: npx playwright test --config playwright.live.config.js
      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factoryflow-live-browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/factoryflow-server.log
          if-no-files-found: ignore
          retention-days: 7
