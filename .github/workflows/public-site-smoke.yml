name: FactoryFlow Public Site Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/tests-public/**'
      - 'frontend/playwright.public.config.js'
      - '.github/workflows/public-site-smoke.yml'

permissions:
  contents: read

jobs:
  public-site-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Korean fonts and prepare visual evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ko family | head -n 3
          google-chrome --version
          mkdir -p public-qa
      - name: Confirm public host DNS and HTTP response
        run: |
          getent ahostsv4 factoryflow.kro.kr || true
          curl --location --silent --show-error --max-time 20 --output /dev/null --write-out 'Public status: %{http_code} / %{url_effective}\n' https://factoryflow.kro.kr/movements || true
      - name: Live Chrome smoke against public site
        run: npx playwright test --config playwright.public.config.js
      - name: Retain screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoryflow-public-site-evidence
          path: |
            frontend/public-qa
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
