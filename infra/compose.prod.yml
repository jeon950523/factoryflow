# Oracle VM template. Caddy runs on the host and handles public 80/443.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: factoryflow
      MYSQL_USER: factoryflow
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - >
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER"
          "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/factoryflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: factoryflow
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      FACTORYFLOW_ADMIN_USERNAME: ${FACTORYFLOW_ADMIN_USERNAME:?First admin username is required}
      FACTORYFLOW_ADMIN_PASSWORD: ${FACTORYFLOW_ADMIN_PASSWORD:?First admin password is required}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Dfile.encoding=UTF-8"
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    driver: bridge
volumes:
  mysql_prod_data:
