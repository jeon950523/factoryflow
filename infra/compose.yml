services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: factoryflow
      MYSQL_USER: factoryflow
      MYSQL_PASSWORD: ${FACTORYFLOW_DB_PASSWORD:?Set FACTORYFLOW_DB_PASSWORD in infra/.env}
      MYSQL_ROOT_PASSWORD: ${FACTORYFLOW_DB_ROOT_PASSWORD:?Set FACTORYFLOW_DB_ROOT_PASSWORD in infra/.env}
      TZ: UTC
    ports:
      - "127.0.0.1:${FACTORYFLOW_DB_PORT:-23307}:3306"
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
          "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
